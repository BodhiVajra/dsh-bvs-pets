<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DeepSeek 窗口宠物预览</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    font: 15px/1.45 -apple-system, "PingFang SC", sans-serif;
    background: #1c1c1f;
    color: #f4f1ea;
  }
  main { max-width: 980px; margin: 0 auto; padding: 28px 20px 64px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 8px; }
  p { margin: 0 0 18px; color: #b9b4aa; }
  .checker {
    background-color: #2a2a2e;
    background-image:
      linear-gradient(45deg, #3a3a40 25%, transparent 25%),
      linear-gradient(-45deg, #3a3a40 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #3a3a40 75%),
      linear-gradient(-45deg, transparent 75%, #3a3a40 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
  }
  .stage { width: 320px; height: 320px; border-radius: 16px; }
  .stage video { width: 100%; height: 100%; display: block; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 22px; }
  figure { margin: 0; }
  figure video { width: 180px; height: 180px; display: block; border-radius: 12px; cursor: pointer; }
  figcaption { color: #b9b4aa; font-size: 12px; margin-top: 6px; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  button {
    font: inherit; color: inherit; background: #2e2e33; border: 0; border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: #3a3a41; }
  #status { min-height: 1.4em; color: #d6d1c7; }
</style>
</head>
<body>
<main>
  <h1>DeepSeek</h1>
  <p>棋盘格上应透出格子，四角不能是黑块。舞台上的片子播完停在最后一帧，再用按钮换下一段。</p>
  <div class="checker stage"><video id="stage" muted playsinline></video></div>
  <div class="acts">
    <button data-src="deepseek/shy.webm">害羞</button>
    <button data-src="deepseek/sajiao.webm">撒娇</button>
    <button data-src="deepseek/eat.webm">吃饭</button>
    <button data-src="deepseek/angry.webm">生气</button>
    <button data-src="deepseek/cute.webm">装可爱</button>
    <button data-src="deepseek/sad.webm">伤心</button>
    <button data-src="deepseek/argue.webm">狡辩</button>
    <button data-src="deepseek/show.webm">表现</button>
    <button data-src="deepseek/walk.webm">走路</button>
    <button data-src="deepseek/jog.webm">小跑</button>
    <button data-src="deepseek/dodge.webm">躲避</button>
    <button data-src="deepseek/block.webm">阻拦</button>
  </div>
  <p id="status"></p>
  <div class="row">
    <figure><video class="checker" src="deepseek/shy.webm" muted playsinline></video><figcaption>shy · 害羞，播完停住</figcaption></figure>
    <figure><video class="checker" src="deepseek/sajiao.webm" muted playsinline></video><figcaption>sajiao · 撒娇，播完停住</figcaption></figure>
    <figure><video class="checker" src="deepseek/eat.webm" muted playsinline></video><figcaption>eat · 吃饭，播完停住</figcaption></figure>
    <figure><video class="checker" src="deepseek/angry.webm" muted playsinline></video><figcaption>angry · 生气，播完停住</figcaption></figure>
    <figure><video class="checker" src="deepseek/cute.webm" muted playsinline></video><figcaption>cute · 装可爱，播完停住</figcaption></figure>
    <figure><video class="checker" src="deepseek/sad.webm" muted playsinline></video><figcaption>sad · 伤心，播完停住</figcaption></figure>
    <figure><video class="checker" src="deepseek/argue.webm" muted playsinline></video><figcaption>argue · 狡辩，播完停住</figcaption></figure>
    <figure><video class="checker" src="deepseek/show.webm" muted playsinline></video><figcaption>show · 表现，播完停住</figcaption></figure>
    <figure><video class="checker" src="deepseek/walk.webm" muted playsinline loop></video><figcaption>walk · 走路，来回循环</figcaption></figure>
    <figure><video class="checker" src="deepseek/jog.webm" muted playsinline loop></video><figcaption>jog · 小跑，路远时循环</figcaption></figure>
    <figure><video class="checker" src="deepseek/dodge.webm" muted playsinline></video><figcaption>dodge · 躲避，播完停住</figcaption></figure>
    <figure><video class="checker" src="deepseek/block.webm" muted playsinline></video><figcaption>block · 阻拦，播完停住</figcaption></figure>
  </div>
</main>
<script>
  var stage = document.getElementById('stage')
  var caption = document.getElementById('status')
  var labels = {
    'deepseek/shy.webm': '害羞',
    'deepseek/sajiao.webm': '撒娇',
    'deepseek/eat.webm': '吃饭',
    'deepseek/angry.webm': '生气',
    'deepseek/cute.webm': '装可爱',
    'deepseek/sad.webm': '伤心',
    'deepseek/argue.webm': '狡辩',
    'deepseek/show.webm': '表现',
    'deepseek/walk.webm': '走路',
    'deepseek/jog.webm': '小跑',
    'deepseek/dodge.webm': '躲避',
    'deepseek/block.webm': '阻拦',
  }
  function labelOf(src) {
    var key = String(src || '').replace(/^.*\//, 'deepseek/')
    return labels[key] || labels[src] || '这段'
  }
  function show(src) {
    caption.textContent = labelOf(src) + ' · 播放中'
    stage.loop = false
    if (stage.getAttribute('src') !== src) stage.src = src
    else stage.currentTime = 0
    var playing = stage.play()
    if (playing && playing.catch) playing.catch(function () {})
  }
  function markHeld() {
    if (stage.duration && stage.currentTime >= stage.duration - 0.05) {
      caption.textContent = labelOf(stage.getAttribute('src')) + ' · 停在最后一帧'
    }
  }
  stage.addEventListener('ended', markHeld)
  stage.addEventListener('pause', markHeld)
  document.querySelector('.acts').addEventListener('click', function (event) {
    var button = event.target.closest('button')
    if (!button) return
    show(button.dataset.src)
  })
  document.querySelector('.row').addEventListener('click', function (event) {
    var video = event.target.closest('video')
    if (!video) return
    video.currentTime = 0
    video.play()
  })
  show('deepseek/shy.webm')
</script>
</body>
</html>
